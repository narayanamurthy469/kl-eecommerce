<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLECommerce - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <img src="images/logo.png" alt="KLECommerce Logo">
        </div>

        <div class="search">
            <input type="text" placeholder="Search Products">
            <input type="submit" value="Search">
        </div>

        <div class="account">
            <a href="login.html">Login</a> |
            <a href="register.html">Register</a> |
            <b>Cart (0)</b>
        </div>

    </header>


    <!-- CATEGORY MENU -->
    <nav class="categories">

        <div>Fashion</div>
        <div>Groceries</div>
        <div>Electronics</div>
        <div>Mobiles</div>
        <div>Appliances</div>
        <div>Beauty</div>
        <div>Books</div>
        <div>Sports</div>

    </nav>


    <!-- LOGIN -->
    <main class="auth-section">

        <div class="auth-box">

            <h2>LOGIN</h2>

            <form id="loginForm">

                <label>Email</label>
                <input type="email"
                       id="loginEmail"
                       placeholder="Enter Email"
                       required>

                <label>Password</label>
                <input type="password"
                       id="loginPassword"
                       placeholder="Enter Password"
                       required>

                <button type="submit">Login</button>

            </form>

            <p>
                New User?
                <a href="register.html">Register Here</a>
            </p>

        </div>

    </main>


    <!-- FOOTER -->
          <footer class="footer">

            <h2>KLECommerce</h2>

            <p>
                Home |
                Products |
                About Us |
                Contact Us |
                Help
            </p>

            <p>
                Copyright © 2026 KLECommerce
            </p>

        </footer>

</div>

<script src="script.js"></script>

</body>
</html>
